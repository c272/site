<div class="w-full">
    <div class="mt-8 mb-4">
      <hr />
    </div>
    <nav class="flex w-full">
        <div>
            {{ with .PrevInSection }}
            <div class="post-link">
                <a href="{{ .RelPermalink }}">← Previous</a>
            </div>
            {{ end }}
        </div>
        <div class="grow"></div>
        <div class="">
            {{ with .NextInSection }}
            <div class="post-link">
                <a href="{{ .RelPermalink }}">Next →</a>
            </div>
            {{ end }}
        </div>
    </nav>
</div>
