<header>
  <div class="flex flex-row w-full mb-10">
    <a href="{{ .Site.BaseURL }}">
      <img src="{{ relURL "/img/logo_mark.png" }}" class="h-8 self-center mr-2" alt="c272" />
    </a>
    <div class="grow"></div>
    <div class="flex flex-row gap-x-5 self-end">
      {{ range .Site.Params.quickLinks }}
        <a href="{{ relURL .relURL }}">
          {{ .title }}
        </a>
      {{ end }}
    </div>
  </div>
</header>
