{{ define "main" }}
<!-- If this is page 1, show the section overview. -->
{{ if (eq .Paginator.PageNumber 1) }}
<div class="mt-14 mb-8 lg:mb-16">
  <!-- Header & title line. -->
  <div class="flex w-full justify-center">
    <div class="h-px grow bg-light-border self-center"></div>
    <h1 class="mx-6 my-0">Posts</h1>
    <div class="h-px grow bg-light-border self-center"></div>
  </div>
  <!-- Subtitle line. -->
  <div class="w-full text-center text-light-secondary italic collapse lg:visible">
    <p>Longer writing on various topics.</p>
  </div>
</div>
{{ end }}

<!-- Add all of the items within the list. -->
<div>
  {{ range .Paginator.Pages }} {{ .Render "li" }} {{ end }}
</div>

<!-- Bottom paginator. -->
<div class="paginator-bottom">{{ partial "utils/paginator.html" . }}</div>
{{ end }}
