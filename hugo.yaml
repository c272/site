baseURL: "http://c272.org/"
languageCode: "en-uk"
title: "c272"

# RSS configuration.
copyright: "(c) c272, All rights reserved."

# Build parameters (tailwind).
build:
  buildStats:
    enable: true
  cachebusters:
  - source: 'assets/notwatching/hugo_stats\.json'
    target: css
  - source: 'tailwind\.config\.js'
    target: css
module:
  mounts:
  - source: assets
    target: assets
  - disableWatch: true
    source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json

# Merge theme specific config.
# Also, disable HTML sanitation in posts (thanks older me...)
markup:
  goldmark:
    renderer:
      unsafe: true
  _merge: deep

# Length of the summary:
summaryLength: 180

# Configurable site parameters.
params:
  meta:
    description: "A variety of writings by C272."
    footerLine: "A variety of writings by C272."

    # The link hidden within the heart in page footers.
    hiddenHeartLink: "https://youtu.be/tZd4jjhLkWg?t=774"

  # Quick links in the navigation bar.
  quickLinks:
    - title: posts
      relURL: /blog/code
    - title: notes
      relURL: /notes
    - title: now
      relURL: /now
    - title: rss
      relURL: /index.xml
    - title: about
      relURL: /about

  # Information about the site author.
  author:
    name: "c272"

    # Social media links in header.
    socials:
      github: c272
      mail: dev@c272.org
      rss: true

  # The default post cover.
  coverImage: "/img/profile/pfp_black.png"

  look:
    # Path to the SVG logo of the site.
    logoSVG: "/img/coffeecup.svg"

    # The Google Fonts configuration to use.
    googleFonts:
      - family: "Noto Serif JP"
      - family: "Geist Mono"
