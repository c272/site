baseURL: 'http://c272.org/'
languageCode: 'en-uk'
title: 'c272'
theme: 'coffeeline'

# RSS configuration.
copyright: "(c) c272, All rights reserved."

# Merge theme specific config.
# Also, disable HTML sanitation in posts (thanks older me...)
markup:
  goldmark:
    renderer:
      unsafe: true
  _merge: deep

# Configurable site parameters.
params:
  meta:
    description: 'A hodge-podge of blogs written by C272.'
    footerLine: 'A variety of blogs written by C272.'

    # The link hidden within the heart in page footers.
    hiddenHeartLink: 'https://youtu.be/tZd4jjhLkWg?t=774'

  # Quick links in the navigation bar.
  quickLinks:
    - title: code
      relURL: /blog/code
    - title: language
      relURL: /blog/language
    - title: jp 
      relURL: /blog/jp
    - title: about 
      relURL: /about

  # Information about the site author.
  author: 
    name: 'c272'

    # Social media links in header.
    socials:
      # youtube:
      # stackoverflow:
      # twitter:
      # mastodon: (whole link)
      github: c272
      mail: dev@c272.org
      rss: true

  # The default post cover.
  coverImage: '/img/profile/pfp_black.png'

  look:
    # Path to the SVG logo of the site.
    logoSVG: '/img/coffeecup.svg'

    # The Google Fonts configuration to use.
    googleFonts:
      - cssNames: '"Inter", "Zen Kaku Gothic Antique", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif'
        family: 'Inter:wght@100;200;300;400;500;600;700;800;900'
        target: text
      - cssNames: '"Rubik", "Inter"'
        family: 'Rubik:wght@800'
        target: logoText
      - cssNames: ''
        family: 'Zen Kaku Gothic Antique:wght@300;400;500;700;900'
